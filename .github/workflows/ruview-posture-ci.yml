name: RuView posture ESP32-S3

on:
  push:
    branches:
      - codex/s3-posture-poc
  pull_request:
    paths:
      - "examples/ruview-posture/**"
      - "examples/esp-radar/wifi_sensing_demo/**"
      - ".github/workflows/ruview-posture-ci.yml"
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf@sha256:00e94c6ff8bc1f7bd22b234ff43db3f3056cb33dedac6819df9fbedbcb5c6ebb
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: posture-tx
            project: examples/ruview-posture/posture_tx
            defaults: sdkconfig.defaults
          - name: posture-rx-node2
            project: examples/ruview-posture/posture_rx
            defaults: sdkconfig.defaults
          - name: posture-rx-node3
            project: examples/ruview-posture/posture_rx
            defaults: sdkconfig.defaults;sdkconfig.defaults.node3
          - name: official-wifi-sensing
            project: examples/esp-radar/wifi_sensing_demo
            defaults: sdkconfig.defaults
    steps:
      - uses: actions/checkout@v4

      - name: Trust checked-out sources
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ESP32-S3 firmware
        shell: bash
        working-directory: ${{ matrix.project }}
        env:
          SDKCONFIG_DEFAULTS: ${{ matrix.defaults }}
        run: |
          source /opt/esp/idf/export.sh
          idf.py --version | tee /tmp/idf-version.txt
          grep -Eq 'v?5\.5(\.0)?([^0-9]|$)' /tmp/idf-version.txt
          idf.py set-target esp32s3
          idf.py build
          test -f build/flasher_args.json

      - name: Collect flash artifacts
        if: startsWith(matrix.name, 'posture-')
        shell: bash
        working-directory: ${{ matrix.project }}
        run: |
          mkdir -p artifact/bootloader artifact/partition_table
          cp build/flasher_args.json artifact/
          cp build/flash_args artifact/
          cp build/bootloader/bootloader.bin artifact/bootloader/
          cp build/partition_table/partition-table.bin artifact/partition_table/
          cp build/*.bin artifact/
          (
            cd artifact
            find . -type f -not -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
            python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("flasher_args.json").read_text())
          missing = [
              path for path in manifest["flash_files"].values()
              if not Path(path).is_file()
          ]
          if missing:
              raise SystemExit(f"missing flash files: {missing}")
          PY
          )

      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.name, 'posture-')
        with:
          name: esp32s3-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.project }}/artifact
          if-no-files-found: error
